name: post-kick (見張り役からの起動)

# 定時実行（schedule）が混雑で起動しない・大きく遅れるとき用の起動口。
# クラウドの見張り役は GitHub の起動ボタン（workflow_dispatch）を押せないので、
# 代わりに kick/request.txt を書いた合図ブランチ（claude/kick-* など）を push する。
# push での起動は遅れにくい。投稿と記録は main に対して行い、合図ブランチは最後に消す。
# post.yml と同じ concurrency グループなので、投稿中の実行があれば終わるまで待ち、
# その後は state/done/YYYY-MM-DD.done を見て二重投稿せずに終わる。
on:
  push:
    branches-ignore: [main, media, media-story]
    paths: ['kick/request.txt']

permissions:
  contents: write

concurrency:
  group: senjo-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: main を取得（投稿の順番と記録は main が正）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 合図を読む（post / story-1200 / story-1800。何も書いていなければ post）
        id: req
        run: |
          git fetch -q origin "${GITHUB_SHA}"
          REQ=$(git show "${GITHUB_SHA}:kick/request.txt" | tr -d '\r' | grep -E '^(post|story-1200|story-1800)$' | sort -u | tr '\n' ' ')
          [ -z "$REQ" ] && REQ="post"
          echo "合図ブランチ: ${GITHUB_REF_NAME} / 要求: $REQ"
          echo "slots=$REQ" >> "$GITHUB_OUTPUT"

      - name: ffmpeg を用意
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1

      - name: 実行（目標時刻前なら待ち、過ぎていればすぐ出す）
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          CAPTION_DOC_ID: ${{ secrets.CAPTION_DOC_ID }}
          GH_TOKEN: ${{ github.token }}
          SLOTS: ${{ steps.req.outputs.slots }}
        run: |
          git pull -q --ff-only origin main || true
          RC=0
          for s in story-1200 post story-1800; do
            case " $SLOTS " in *" $s "*) ;; *) continue ;; esac
            echo "=== $s ==="
            case $s in
              post)       python3 scripts/daily.py || RC=1 ;;
              story-1200) SLOT=12:00 python3 scripts/story.py || RC=1 ;;
              story-1800) SLOT=18:00 python3 scripts/story.py || RC=1 ;;
            esac
          done
          exit $RC

      - name: 投稿記録を main に保存し、合図ブランチを消す
        if: always()
        run: |
          git config user.name "senjo-autopost-bot"
          git config user.email "actions@github.com"
          git add state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "posted (kick) $(TZ=Asia/Tokyo date +%F)" && git pull -q --rebase origin main && git push origin HEAD:main)
          git push origin --delete "${GITHUB_REF_NAME}" || true
